name: "ULN2003 3 Axis"
board: "ESP32"

# Three 28BYJ-48 unipolar steppers, each on its own ULN2003 driver board.
# The unipolar driver writes the four coil phases directly from the step ISR,
# so the phase pins must be gpio and the stepping engine must not be an I2S
# one.

stepping:
  engine: RMT
  idle_ms: 250
  dir_delay_us: 1
  pulse_us: 8
  disable_delay_us: 0

axes:
  shared_stepper_disable_pin: NO_PIN
  x:
    steps_per_mm: 85
    max_rate_mm_per_min: 1000
    acceleration_mm_per_sec2: 50
    max_travel_mm: 200
    motor0:
      unipolar:
        phase0_pin: gpio.27
        phase1_pin: gpio.14
        phase2_pin: gpio.13
        phase3_pin: gpio.4
        half_step: true
  y:
    steps_per_mm: 85
    max_rate_mm_per_min: 1000
    acceleration_mm_per_sec2: 50
    max_travel_mm: 200
    motor0:
      unipolar:
        phase0_pin: gpio.22
        phase1_pin: gpio.21
        phase2_pin: gpio.17
        phase3_pin: gpio.16
        half_step: true
  z:
    steps_per_mm: 78
    max_rate_mm_per_min: 300
    acceleration_mm_per_sec2: 30
    max_travel_mm: 100
    motor0:
      unipolar:
        phase0_pin: gpio.32
        phase1_pin: gpio.33
        phase2_pin: gpio.25
        phase3_pin: gpio.26
        half_step: true

spi:
  miso_pin: gpio.19
  mosi_pin: gpio.23
  sck_pin: gpio.18

sdcard:
  card_detect_pin: NO_PIN
  cs_pin: gpio.5
