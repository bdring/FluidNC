<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FluidNC WASM spike</title>
<style>
  body { font-family: monospace; padding: 2rem; }
  #log { white-space: pre-wrap; border: 1px solid #ccc; padding: 1rem; margin-top: 1rem; }
  .ok { color: #080; }
  .fail { color: #c00; }
</style>
</head>
<body>
<h1>FluidNC WASM validation spike</h1>
<p>Checks: cross-origin isolation, pthread start, JS&lt;-&gt;WASM line round-trip.</p>
<div id="log">loading...</div>

<script>
function log(line, cls) {
  const el = document.getElementById('log');
  const span = document.createElement('div');
  if (cls) span.className = cls;
  span.textContent = line;
  el.appendChild(span);
}
document.getElementById('log').textContent = '';

log('crossOriginIsolated = ' + self.crossOriginIsolated, self.crossOriginIsolated ? 'ok' : 'fail');
log('SharedArrayBuffer available = ' + (typeof SharedArrayBuffer !== 'undefined'),
    typeof SharedArrayBuffer !== 'undefined' ? 'ok' : 'fail');
</script>
<script src="program.js"></script>
<script>
FluidNCModule().then((Module) => {
  log('WASM module instantiated', 'ok');

  const handleLine = Module.cwrap('spike_handle_line', 'string', ['string']);
  const startThread = Module.cwrap('spike_start_thread', null, []);
  const threadCounter = Module.cwrap('spike_thread_counter', 'number', []);

  const resp = handleLine('?');
  log('spike_handle_line("?") -> ' + resp, resp.startsWith('<Idle') ? 'ok' : 'fail');

  const badResp = handleLine('garbage');
  log('spike_handle_line("garbage") -> ' + badResp);

  log('starting worker pthread...');
  startThread();
  setTimeout(() => {
    const n = threadCounter();
    log('thread counter after 300ms = ' + n, n > 0 ? 'ok' : 'fail');
  }, 300);
}).catch((err) => {
  log('WASM module failed to load: ' + err, 'fail');
});
</script>
</body>
</html>
