  sleep:
    type: string (hex color RRGGBB, or "none")
    default: '"001F00"'
    default_note: 'dim green'
    description: |
      Color shown while in Sleep state.

  configAlarm:
    type: string (hex color RRGGBB, or "none")
    default: '"7f0000"'
    default_note: 'red'
    description: |
      Color shown when a configuration error put the machine into ConfigAlarm state at startup.
