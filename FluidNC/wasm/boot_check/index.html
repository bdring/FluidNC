<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FluidNC WASM boot check</title>
<style>
  body { font-family: monospace; padding: 2rem; }
  #log { white-space: pre-wrap; border: 1px solid #ccc; padding: 1rem; margin-top: 1rem; max-height: 70vh; overflow-y: auto; }
  input { font-family: monospace; width: 30rem; }
</style>
</head>
<body>
<h1>FluidNC WASM boot check</h1>
<p>Real FluidNC/src, real setup()/loop() on a background thread. A minimal config.yaml (no VFD/SD, out of core-only scope) is staged into MEMFS's /native_localfs before boot, then locked read-only.</p>
<div id="log">loading...</div>
<input id="cmdline" placeholder="type a line, e.g. $I or ?, press Enter" autofocus>

<script>
const logEl = document.getElementById('log');
logEl.textContent = '';
function log(line) {
  const div = document.createElement('div');
  div.textContent = line;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}
self.fluidncOnOutput = (text) => log(text);

const TEST_CONFIG_YAML = `
name: "WASM test machine"
board: "None"

stepping:
  engine: timed
  idle_ms: 255
  dir_delay_us: 10
  pulse_us: 1
  disable_delay_us: 0

axes:
  x:
    steps_per_mm: 800
    max_rate_mm_per_min: 3000
    acceleration_mm_per_sec2: 100
    max_travel_mm: 300
    motor0:
      standard_stepper:
        step_pin: gpio.10
        direction_pin: gpio.11

  y:
    steps_per_mm: 800
    max_rate_mm_per_min: 3000
    acceleration_mm_per_sec2: 100
    max_travel_mm: 300
    motor0:
      standard_stepper:
        step_pin: gpio.13
        direction_pin: gpio.14

  z:
    steps_per_mm: 800
    max_rate_mm_per_min: 3000
    acceleration_mm_per_sec2: 100
    max_travel_mm: 300
    motor0:
      standard_stepper:
        step_pin: gpio.16
        direction_pin: gpio.17

start:
  must_home: false
`;
</script>
<script src="program.js"></script>
<script>
FluidNCModule().then((Module) => {
  log('[page] WASM module instantiated');
  const start = Module.cwrap('fluidnc_start', null, []);
  const sendLine = Module.cwrap('fluidnc_send_line', null, ['string']);
  const stageFile = Module.cwrap('fluidnc_stage_file', 'boolean', ['string', 'string']);
  const lockReadonly = Module.cwrap('fluidnc_lock_localfs_readonly', null, []);

  const staged = stageFile('config.yaml', TEST_CONFIG_YAML);
  log('[page] staged config.yaml: ' + staged);
  lockReadonly();
  log('[page] locked /native_localfs read-only');

  log('[page] calling fluidnc_start()...');
  start();
  log('[page] fluidnc_start() returned (should be immediate, not blocked)');

  document.getElementById('cmdline').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const line = e.target.value;
      log('> ' + line);
      sendLine(line);
      e.target.value = '';
    }
  });
}).catch((err) => {
  log('[page] WASM module failed to load: ' + err);
});
</script>
</body>
</html>
