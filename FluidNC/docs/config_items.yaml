axes.<letter>.motorN.rc_servo:
  output_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: pwm
    description: |
      PWM signal output to the servo.

  pwm_hz:
    type: integer
    min: 50
    max: 200
    default: '50'
    tuning: typical
    description: |
      Servo PWM pulse repetition rate. 50Hz is the standard analog-servo value; some digital servos can repeat faster.

  min_pulse_us:
    type: integer
    min: 500
    max: 2500
    default: '1000'
    tuning: per-machine
    description: |
      Pulse width, in microseconds, corresponding to one end of the servo's travel.

  max_pulse_us:
    type: integer
    min: 500
    max: 2500
    default: '2000'
    tuning: per-machine
    description: |
      Pulse width, in microseconds, corresponding to the other end of the servo's travel.

  timer_ms:
    type: integer
    min: 20
    max: 250
    default: '20'
    tuning: typical
    description: |
      Update interval, in milliseconds, for refreshing the servo's PWM position.

axes.<letter>.motorN.solenoid:
  output_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: pwm
    description: |
      PWM signal output driving the solenoid.

  pwm_hz:
    type: integer
    min: 1000
    max: 100000
    default: '1000'
    tuning: typical
    description: |
      PWM frequency driving the solenoid.

  off_percent:
    type: float
    min: 0.0f
    max: 100.0f
    default: '0.0'
    tuning: typical
    description: |
      Duty cycle while off.

  pull_percent:
    type: float
    min: 0.0f
    max: 100.0f
    default: '100.0'
    tuning: typical
    description: |
      Duty cycle during the initial pull-in (highest power, to overcome the solenoid's resting inertia).

  hold_percent:
    type: float
    min: 0.0f
    max: 100.0f
    default: '75.0'
    tuning: typical
    description: |
      Duty cycle after pull-in, while holding the solenoid engaged -- typically lower than pull_percent, since holding a solenoid needs less power than pulling it in.

  pull_ms:
    type: integer
    min: 0
    max: 3000
    default: '500'
    tuning: typical
    description: |
      How long the pull_percent duty cycle is applied before switching to hold_percent.

  direction_invert:
    type: boolean
    default: 'false'
    tuning: typical
    description: |
      Inverts which side of the axis's mpos 0.0 counts as "active".

  timer_ms:
    type: integer
    min: 20
    max: 250
    default: '50'
    tuning: typical
    description: |
      Update interval, in milliseconds, for the solenoid's PWM state machine (pull/hold timing). Also the divisor pull_ms is measured against (pull_ms / timer_ms update ticks) -- floored at 20, same as RcServo's own timer_ms, to keep that division away from zero.

axes.<letter>.motorN.dynamixel2:
  uart_num:
    type: integer
    default: '-1'
    description: |
      Which top-level uartN: section this servo's Protocol 2 bus runs over. Required -- validate() asserts this is actually set. The servo's own programmed baud should match (1000000 recommended), mode "8N1".

  id:
    type: integer
    default: '255'
    description: |
      This servo's Protocol 2 device ID on the bus. Required to be set to the servo's real, unique ID -- the default, 255, is Dynamixel's broadcast address and not a usable per-device value; validate() asserts it was changed.

  count_min:
    type: integer
    default: '1024'
    description: |
      Servo raw position count corresponding to the low end of the axis's mpos range.

  count_max:
    type: integer
    default: '3072'
    description: |
      Servo raw position count corresponding to the high end of the axis's mpos range.

  timer_ms:
    type: integer
    default: '50'
    description: |
      Update interval, in milliseconds, for refreshing the servo's commanded position.

axes.<letter>.motorN.unipolar:
  phase0_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: output
    description: |
      Coil A drive output, e.g. IN1 on a ULN2003 board.

  phase1_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: output
    description: |
      Coil B drive output, e.g. IN2 on a ULN2003 board.

  phase2_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: output
    description: |
      Coil C drive output, e.g. IN3 on a ULN2003 board.

  phase3_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: output
    description: |
      Coil D drive output, e.g. IN4 on a ULN2003 board.

  half_step:
    type: boolean
    default: 'true'
    description: |
      True uses the 8-phase half-step sequence, which gives twice the resolution and smoother motion than the 4-phase full-step sequence at some cost in torque.  Setting it false selects full-step, which halves the number of steps per revolution, so steps_per_mm must be halved to match.

# Explicit no-op driver -- takes no fields.
axes.<letter>.motorN.null_motor:
PWM:
  tool_num:
    type: integer
    min: 0
    max: MaxToolNumber
    default: '0'
    tuning: typical
    description: |
      Sets the tool-number range this spindle responds to for M6 Tn tool changes. With a single spindle, the value doesn't matter (conventionally 0). With multiple spindles, give each a distinct number -- ranges are implied by relative order, e.g. a relay spindle at tool_num: 0 and a laser at tool_num: 100 makes M6 T0-T99 select the relay and M6 T100+ select the laser.

  speed_map:
    type: std::vector<Configuration::speedEntry>
    default: '0=0% 10000=100%'
    default_note: 'applied by PWM::init() only when speed_map is left unset'
    tuning: typical
    description: |
      Maps GCode S values to actual spindle speeds/PWM duty -- lets the S-to-speed relationship be linearized or clamped to a minimum speed. See the wiki documentation for the full syntax.  The default value is empty, which automatically creates a typical speed map for the individual spindle type.

  off_on_alarm:
    type: boolean
    default: 'false'
    tuning: typical
    description: |
      Turns the spindle off whenever an alarm occurs. Worth enabling with a safety door in use, since the parking feature doesn't operate while in alarm state.

  atc:
    type: string
    default: '""'
    default_note: 'empty'
    tuning: typical
    description: |
      Names an atc_manual:/ATC section (defined elsewhere in the config) to associate with this spindle for automatic tool changes.

  m6_macro:
    type: macro
    default: '""'
    default_note: 'empty'
    tuning: typical
    description: |
      A macro (one config-file line, same syntax as macros:) to run for this spindle's M6 tool change, instead of the built-in tool-change behavior.

  s0_with_disable:
    type: boolean
    default: 'false'
    tuning: typical
    description: |
      When true, an M5 (spindle off) also forces the speed signal to S0 (zero) -- by default the speed output stays at its last commanded value even during M5.

  disable_with_s0:
    type: boolean
    default: 'false'
    tuning: typical
    description: |
      When true, commanding S0 (zero speed) also disables the spindle, the same as M5 -- by default, only M5 itself disables it.

  spinup_ms:
    type: integer
    min: 0
    max: 60000
    default: '0'
    tuning: typical
    description: |
      Time given for the spindle to reach the commanded RPM (per the speed map) before the following GCode line executes. Proportional to the RPM change -- a half-scale speed change only waits half of this value.

  spindown_ms:
    type: integer
    min: 0
    max: 60000
    default: '0'
    tuning: typical
    description: |
      Same as spinup_ms, but applied when the commanded RPM decreases.

  direction_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: output
    description: |
      Optional direction signal. M4 (spindle-reverse) is only accepted when a real pin is assigned here -- without one, only M3/M5 are meaningful.

  output_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: pwm
    description: |
      On/off (or PWM duty, depending on the concrete spindle type -- see that type's own @pin_attributes_for output_pin override, e.g. PWMSpindle.h) output signal. Turns off with M5.

  enable_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: output
    description: |
      Optional enable signal, separate from output_pin.

  pwm_hz:
    type: integer
    min: 1
    max: 20000000
    default: '5000'
    tuning: typical
    description: |
      PWM signal frequency. Resolution trades off against frequency -- 76Hz or less gets the full 20-bit duty-cycle resolution, roughly halving for every doubling of frequency above that, down to 4 levels (2 bits) at the 20MHz ceiling. Not every value in that range is a practical CNC PWM frequency, but the hardware supports the whole span, so it's left open.

# Skips direction_pin (Laser calls OnOff::groupCommon() directly, not OnOff::group()) and never calls Spindle::groupDelaySettings() -- so unlike every other spindle type, spinup_ms/spindown_ms are genuinely absent here, not merely present-but-inert.
Laser:
  tool_num:
    type: integer
    min: 0
    max: MaxToolNumber
    default: '0'
    tuning: typical
    description: |
