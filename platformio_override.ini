[env:oled]
extends = env:wifi
build_src_filter = ${env:wifi.build_src_filter} +<src/OLED.cpp>

[env:wifi]
extra_scripts =
    pre:FluidNC/ld/esp32/i2s_engine_fpermissive.py
    pre:tools/patch_espasyncwebserver_close.py
    pre:tools/patch_espasyncwebserver_diagnostics.py
    pre:tools/patch_asynctcp_diagnostics.py

[env:noradio]
extra_scripts = pre:FluidNC/ld/esp32/i2s_engine_fpermissive.py

[env:bt]
extra_scripts = pre:FluidNC/ld/esp32/i2s_engine_fpermissive.py
