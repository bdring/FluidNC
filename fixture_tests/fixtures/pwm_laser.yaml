# Minimal single-axis + Laser-spindle config for test_pwm_rate_adjustment.py.
# Only exists to exercise capture/PwmPin.cpp's [MSG:PWM: ...] instrumentation
# against the real rate-adjustment path in Stepper.cpp -- the axis is just
# enough motion to drive that, not a real machine. sim.0 needs no real GPIO;
# gpio.2 for the Laser output needs to be a plausible pin number but nothing
# is actually wired to it in the native/capture build.
name: "PWM rate-adjustment test rig"
board: "PWM rate-adjustment test rig"

stepping:
  engine: timed
  idle_ms: 255
  dir_delay_us: 10
  pulse_us: 1
  disable_delay_us: 0

axes:
  x:
    steps_per_mm: 100
    max_rate_mm_per_min: 3000
    acceleration_mm_per_sec2: 100
    max_travel_mm: 300
    motor0:
      hard_limits: false
      pulloff_mm: 1.000
      standard_stepper:
        step_pin: sim.0
        direction_pin: sim.0:low

Laser:
  output_pin: gpio.2
  pwm_hz: 5000

start:
  must_home: false
  deactivate_parking: true
  check_limits: false
