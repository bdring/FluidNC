    max: MaxToolNumber
    default: '0'
    tuning: typical
    description: |
      Sets the tool-number range this spindle responds to for M6 Tn tool changes. With a single spindle, the value doesn't matter (conventionally 0). With multiple spindles, give each a distinct number -- ranges are implied by relative order, e.g. a relay spindle at tool_num: 0 and a laser at tool_num: 100 makes M6 T0-T99 select the relay and M6 T100+ select the laser.

  speed_map:
    type: std::vector<Configuration::speedEntry>
    default: '0=0% 1=100%'
    default_note: 'applied by PlasmaSpindle::init() only when unset -- step function: 0 is off, any nonzero S is full on'
    tuning: typical
    description: |
      Maps GCode S values to actual spindle speeds/PWM duty -- lets the S-to-speed relationship be linearized or clamped to a minimum speed. See the wiki documentation for the full syntax.  The default value is empty, which automatically creates a typical speed map for the individual spindle type.

  off_on_alarm:
    type: boolean
    default: 'false'
    tuning: typical
    description: |
      Turns the spindle off whenever an alarm occurs. Worth enabling with a safety door in use, since the parking feature doesn't operate while in alarm state.

  atc:
    type: string
    default: '""'
    default_note: 'empty'
    tuning: typical
    description: |
      Names an atc_manual:/ATC section (defined elsewhere in the config) to associate with this spindle for automatic tool changes.

  m6_macro:
    type: macro
    default: '""'
    default_note: 'empty'
    tuning: typical
    description: |
      A macro (one config-file line, same syntax as macros:) to run for this spindle's M6 tool change, instead of the built-in tool-change behavior.

  s0_with_disable:
    type: boolean
    default: 'false'
    tuning: typical
    description: |
      When true, an M5 (spindle off) also forces the speed signal to S0 (zero) -- by default the speed output stays at its last commanded value even during M5.

  disable_with_s0:
    type: boolean
    default: 'false'
    tuning: typical
    description: |
      When true, commanding S0 (zero speed) also disables the spindle, the same as M5 -- by default, only M5 itself disables it.

  enable_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: output
    description: |
      Enables the plasma cutter's torch/arc-start signal.

  arc_ok_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: input
    description: |
      Input signaling that the plasma arc has successfully started (transferred). If this goes inactive while the arc was on, motion is aborted with an alarm.

  arc_wait_ms:
    type: integer
    min: 0
    max: 3000
    default: '1000'
    tuning: typical
    description: |
      How long to wait for arc_ok_pin to confirm the arc has started before giving up.

# The "Null" spindle -- takes no fields, no I/O.
NoSpindle:
# Also backs Huanyang/YL620/H2A/SiemensV20/NowForever/FolinnBD600/DeltaMS300/H100/MollomG70/DanfossVLT2800 -- each registers under its own name with fixed constructor-supplied command strings, adding no fields of its own. spinup_ms/spindown_ms are always present here (VFDSpindle::group() always calls groupDelaySettings()), but only actually applied at runtime when get_rpm_cmd is left unset -- see get_rpm_cmd's own description for why.
ModbusVFD:
  tool_num:
    type: integer
    min: 0
    max: MaxToolNumber
    default: '0'
    tuning: typical
    description: |
      Sets the tool-number range this spindle responds to for M6 Tn tool changes. With a single spindle, the value doesn't matter (conventionally 0). With multiple spindles, give each a distinct number -- ranges are implied by relative order, e.g. a relay spindle at tool_num: 0 and a laser at tool_num: 100 makes M6 T0-T99 select the relay and M6 T100+ select the laser.

  speed_map:
    type: std::vector<Configuration::speedEntry>
    default: '""'
    default_note: 'empty'
    tuning: typical
    description: |
      Maps GCode S values to actual spindle speeds/PWM duty -- lets the S-to-speed relationship be linearized or clamped to a minimum speed. See the wiki documentation for the full syntax.  The default value is empty, which automatically creates a typical speed map for the individual spindle type.

  off_on_alarm:
    type: boolean
    default: 'false'
    tuning: typical
    description: |
      Turns the spindle off whenever an alarm occurs. Worth enabling with a safety door in use, since the parking feature doesn't operate while in alarm state.

  atc:
    type: string
    default: '""'
    default_note: 'empty'
    tuning: typical
    description: |
      Names an atc_manual:/ATC section (defined elsewhere in the config) to associate with this spindle for automatic tool changes.

  m6_macro:
    type: macro
    default: '""'
    default_note: 'empty'
    tuning: typical
    description: |
      A macro (one config-file line, same syntax as macros:) to run for this spindle's M6 tool change, instead of the built-in tool-change behavior.

  s0_with_disable:
    type: boolean
    default: 'false'
    tuning: typical
    description: |
      When true, an M5 (spindle off) also forces the speed signal to S0 (zero) -- by default the speed output stays at its last commanded value even during M5.

  disable_with_s0:
    type: boolean
    default: 'false'
    tuning: typical
    description: |
      When true, commanding S0 (zero speed) also disables the spindle, the same as M5 -- by default, only M5 itself disables it.

  spinup_ms:
    type: integer
    min: 0
    max: 60000
    default: '0'
    tuning: typical
    description: |
      Time given for the spindle to reach the commanded RPM (per the speed map) before the following GCode line executes. Proportional to the RPM change -- a half-scale speed change only waits half of this value.

  spindown_ms:
    type: integer
    min: 0
    max: 60000
    default: '0'
    tuning: typical
    description: |
      Same as spinup_ms, but applied when the commanded RPM decreases.

  uart_num:
    type: integer
    default: '-1'
    default_note: 'not configured'
    description: |
      Which top-level uartN: section this VFD's Modbus link runs over.

  modbus_id:
    type: integer
    min: 0
    max: 247
    default: '1'
    tuning: typical
    description: |
      Modbus slave address of the VFD -- must match the VFD's own configured value (per https://modbus.org/docs/PI_MBUS_300.pdf). When in doubt, try 1.

  debug:
    type: integer
    min: 0
    max: 5
    default: '2'
    description: |
      Debug message verbosity: 0-1 no debug info, 2 shows missing responses and speed info, 3+ also shows raw Rx/Tx Modbus messages.

  poll_ms:
    type: integer
    min: 250
    max: 20000
    default: '250'
    description: |
      How often, in milliseconds, to poll the VFD over Modbus for status/speed.

  retries:
    type: integer
    default: '5'
    description: |
      Number of failed Modbus exchanges tolerated before raising an alarm.

  model:
    type: string
    default: '""'
    default_note: 'empty'
    tuning: per-machine
    description: |
      VFD model name. Informational (used for support purposes) -- not itself used to select protocol behavior; the cw_cmd/ccw_cmd/etc. fields below are what actually define the protocol. Only meaningful under the plain ModbusVFD: top-level key, for a custom/unsupported VFD -- a supported model (e.g. H2A, Huanyang) is instead selected by using that model's own top-level config key, which supplies all of the fields below itself; this field is never read at runtime, so setting it under ModbusVFD: does NOT apply that model's own values.

  min_RPM:
    type: integer
    default: '0xffffffff'
    default_note: 'uninitialized sentinel'
    tuning: per-machine
    description: |
      Minimum spindle RPM, in Hz-derived RPM terms. Normally left unset and retrieved from the VFD itself via get_min_rpm_cmd at startup.

  max_RPM:
    type: integer
    default: '0xffffffff'
    default_note: 'uninitialized sentinel'
    tuning: per-machine
    description: |
      Maximum spindle RPM. Normally left unset and retrieved from the VFD itself via get_max_rpm_cmd at startup.

  cw_cmd:
    type: string
    default: '""'
    default_note: 'empty'
    tuning: per-machine
    description: |
      Modbus command template for clockwise spindle rotation.

  ccw_cmd:
    type: string
    default: '""'
    default_note: 'empty'
    tuning: per-machine
    description: |
      Modbus command template for counter-clockwise spindle rotation.

  off_cmd:
    type: string
    default: '""'
    default_note: 'empty'
    tuning: per-machine
    description: |
      Modbus command template to stop the spindle.

  set_rpm_cmd:
    type: string
    default: '""'
    default_note: 'empty'
    tuning: per-machine
    description: |
      Modbus command template to set the spindle speed.

  get_min_rpm_cmd:
    type: string
    default: '""'
    default_note: 'empty'
    tuning: per-machine
    description: |
      Modbus command template to query the VFD's minimum RPM. If left unset, speed_map must be configured manually instead of being auto-derived.

  get_max_rpm_cmd:
    type: string
    default: '""'
    default_note: 'empty'
    tuning: per-machine
    description: |
      Modbus command template to query the VFD's maximum RPM. If left unset, speed_map must be configured manually instead of being auto-derived.

  get_rpm_cmd:
    type: string
    default: '""'
    default_note: 'empty'
    tuning: per-machine
    description: |
      Modbus command template to query the VFD's current RPM. spinup_ms/ spindown_ms (Spindle::groupDelaySettings()) are always present in config.yaml for a VFD spindle regardless of this field -- what this field changes is whether they're actually used at runtime. When set, use_speed_feedback() returns true and VFDSpindle actively polls this command until it confirms the real target speed, ignoring spinup_ms/ spindown_ms entirely; when left empty, there's no way to confirm real speed, so it falls back to blindly waiting out spinup_ms/spindown_ms instead.

kinematics.ParallelDelta:
  crank_mm:
    type: float
    min: 50.0
    max: 500.0
    default: '70.0'
    tuning: per-machine
    description: |
      Length of the crank arm attached to each motor.

  base_triangle_mm:
    type: float
    min: 20.0
    max: 500.0
    default: '179.437'
    tuning: per-machine
    description: |
      Side length of the fixed base triangle (where the motors/cranks mount).

  linkage_mm:
    type: float
    min: 20.0
    max: 500.0
    default: '133.5'
    tuning: per-machine
    description: |
      Length of the linkage arm connecting each crank to the end effector.

  end_effector_triangle_mm:
    type: float
    min: 20.0
    max: 500.0
    default: '86.603'
    tuning: per-machine
    description: |
      Side length of the moving end-effector triangle (where the tool mounts).

  kinematic_segment_len_mm:
    type: float
    min: 0.05
    max: 20.0
    default: '1.0'
    tuning: typical
    description: |
      Maximum length of the small linear segments a cartesian move is broken into before being converted to arm angles -- delta kinematics are nonlinear, so moves are approximated as a series of short, nearly-linear segments (the same idea FluidNC uses for tessellating arcs).

  use_servos:
    type: boolean
    default: 'false'
    tuning: typical
    description: |
      Set true when the arms are driven by servos rather than steppers -- servos use a different (self-contained) homing approach.

  up_degrees:
    type: float
    min: -90
    max: 0
    default: '-30.0'
    tuning: per-machine
    description: |
      Arm angle, in degrees, considered fully "up" (0 is horizontal, positive angles are below horizontal per this file's own convention -- so "up" is negative).

kinematics.WallPlotter:
  left_axis:
    type: integer
    default: '0'
    tuning: typical
    description: |
      Which machine axis index drives the left cord's length. NOT bounds-checked against MAX_N_AXIS -- see transform_cartesian_to_motors() below for why an out-of-range or Z-and-above value here is unsafe.

  left_anchor_x:
    type: float
    default: '-100'
    tuning: per-machine
    description: |
      X position of the left cord's fixed anchor point, in the cartesian frame.

  left_anchor_y:
    type: float
    default: '100'
    tuning: per-machine
    description: |
      Y position of the left cord's fixed anchor point.

  right_axis:
    type: integer
    default: '1'
    tuning: typical
    description: |
      Which machine axis index drives the right cord's length. NOT bounds-checked -- see left_axis above.

  right_anchor_x:
    type: float
    default: '100'
    tuning: per-machine
    description: |
      X position of the right cord's fixed anchor point.

  right_anchor_y:
    type: float
    default: '100'
    tuning: per-machine
    description: |
      Y position of the right cord's fixed anchor point.

  segment_length:
    type: float
    default: '10'
    tuning: typical
    description: |
      Maximum length of the small linear segments a cartesian move is broken into before being converted to cord lengths (the cord-length transform is nonlinear).

kinematics.CoreXY:
  x_scaler:
    type: float
    min: 0.1
    max: 10.0
    default: '1.0'
    description: |
      Compensation factor for midTbot-style machines where the motors themselves move in X, so a cartesian X move corresponds to a larger motor-space move. Leave at 1 on CoreXY machines where the motors don't move in X.

# No config items at all -- Midtbot::group()/Cartesian::group() are empty. Midtbot hardcodes its x_scaler to 2.0 in init() rather than exposing it as a config item, since that ratio is a fixed property of the midTbot hardware design, not something a user should tune.
# kinematics.midtbot / kinematics.Cartesian: (no config items)

# Registered via a runtime loop over a list of (event, name, letter) tuples, not literal handler.item() calls -- see ItemDocs.md's "data-driven item lists" section. Extracted here from the @config annotations directly.
control:
  safety_door_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: input
    description: |
      Typically wired to an enclosure door switch. While active, quickly stops motion and enters Door mode (often paired with the parking feature); the switch must be deactivated before the machine can be used. If it paused a running job, closing the door and issuing cycle_start (a sender's resume button, or a cycle_start_pin switch) resumes the job.

  reset_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: input
    description: |
      Performs a soft reset, equivalent to sending the Ctrl-X real-time character.

  feed_hold_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: input
    description: |
      Pauses a running job, equivalent to sending the '!' real-time character. Paired with cycle_start_pin, lets a job be paused/resumed with physical buttons.

  cycle_start_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: input
    description: |
      Resumes a paused job, equivalent to sending the '~' real-time character. Paired with feed_hold_pin, lets a job be paused/resumed with physical buttons.

  macro0_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: input
    description: |
      Runs macro0 (configured under macros:) when active, equivalent to sending the 0x87 real-time character.

  macro1_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: input
    description: |
      Runs macro1 (configured under macros:) when active, equivalent to sending the 0x88 real-time character.

  macro2_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: input
    description: |
      Runs macro2 (configured under macros:) when active, equivalent to sending the 0x89 real-time character.

  macro3_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: input
    description: |
      Runs macro3 (configured under macros:) when active, equivalent to sending the 0x8a real-time character.

  fault_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: input
    description: |
      Immediate hard stop (no deceleration, so position accuracy can be lost) and a critical alarm that only a soft reset can clear; also stops the spindle if the active spindle's off_on_alarm is true. Critical alarm state blocks homing and unlock. Functionally identical to estop_pin -- this one is intended for a machine-detected fault signal (e.g. a stepper driver's fault/alarm output), not a user-operated switch.

  estop_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: input
    description: |
      Functionally identical to fault_pin (same hard stop + critical alarm behavior) -- this one is intended for a user-operated emergency-stop switch. Note that this alone is only a control-input-level stop; a true e-stop should also cut power directly.

  homing_button_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: input
    description: |
      Runs $H (home all) when active.

# Same data-driven-list shape as control: above.
user_inputs:
  digital0_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: input
    description: |
      Digital input slot 0.

  digital1_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: input
    description: |
      Digital input slot 1.

  digital2_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: input
    description: |
      Digital input slot 2.

  digital3_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: input
    description: |
      Digital input slot 3.

  digital4_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: input
    description: |
      Digital input slot 4.

  digital5_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: input
    description: |
      Digital input slot 5.

  digital6_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: input
    description: |
      Digital input slot 6.

  digital7_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: input
    description: |
      Digital input slot 7.

  analog0_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: input
    description: |
      Analog input slot 0.

  analog1_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: input
    description: |
      Analog input slot 1.

  analog2_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: input
    description: |
      Analog input slot 2.

  analog3_pin:
    type: pin
    default: 'NO_PIN'
    pin_attributes: input
    description: |
      Analog input slot 3.

# Same data-driven-list shape as control: above. All fields are Strings (one config-file line, "&"-separated).
macros:
  startup_line0:
    type: macro
    default: '""'
    default_note: 'empty'
    tuning: typical
    description: |
      Legacy Grbl feature (formerly $N0). Runs once, the first time the firmware enters Idle after boot.

  startup_line1:
    type: macro
    default: '""'
    default_note: 'empty'
    tuning: typical
    description: |
      Legacy Grbl feature (formerly $N1). Runs once, the first time the firmware enters Idle after boot, immediately after startup_line0.

  macro0:
    type: macro
    default: '""'
    default_note: 'empty'
    tuning: typical
    description: |
      Runs when macro0_pin (control:) is activated. The switch must read inactive at startup -- deactivate it before clearing the alarm, same as any other control input.

  macro1:
    type: macro
    default: '""'
    default_note: 'empty'
    tuning: typical
    description: |
      Runs when macro1_pin (control:) is activated.

  macro2:
    type: macro
    default: '""'
    default_note: 'empty'
    tuning: typical
    description: |
      Runs when macro2_pin (control:) is activated.

  macro3:
    type: macro
    default: '""'
    default_note: 'empty'
    tuning: typical
    description: |
      Runs when macro3_pin (control:) is activated.

  after_homing:
    type: macro
    default: '""'
    default_note: 'empty'
    tuning: typical
    description: |
      Runs after a homing cycle completes -- i.e. once every axis with homing enabled has been homed.

  after_reset:
    type: macro
    default: '""'
    default_note: 'empty'
    tuning: typical
    description: |
      Runs after the system resets (power-on/startup, or a Ctrl-X real-time reset), but only if the system ends up in Idle state immediately after the reset.

  after_unlock:
    type: macro
    default: '""'
    default_note: 'empty'
    tuning: typical
    description: |
      Runs after a $X unlock command.

# PROVISIONAL / DO NOT USE -- the Listeners/SysListener framework this depends on is likely to be removed. Same data-driven-list shape as control: above, one level more indirect (routed through a handleRGBString() wrapper).
rgbled:
  pin:
    type: pin
    default: 'NO_PIN'
    description: |
      Data pin for the NeoPixel/WS2812 LED(s).

  index:
    type: integer
    default: '0'
    description: |
      Which LED index in the strip this listener controls (for a strip with more than one addressable LED).

  idle:
    type: string (hex color RRGGBB, or "none")
    default: '"007F00"'
    default_note: 'green'
    description: |
      Color shown while machine status is Idle.

  alarm:
    type: string (hex color RRGGBB, or "none")
    default: '"7F0000"'
    default_note: 'red'
    description: |
      Color shown while machine status is Alarm.

  checkMode:
    type: string (hex color RRGGBB, or "none")
    default: '"b936bf"'
    default_note: 'magenta'
    description: |
      Color shown while in Grbl Check Mode ($C).

  homing:
    type: string (hex color RRGGBB, or "none")
    default: '"501f00"'
    default_note: 'orange-brown'
    description: |
      Color shown while homing.

  cycle:
    type: string (hex color RRGGBB, or "none")
    default: '"7f4422"'
    default_note: 'orange'
    description: |
      Color shown while running (Cycle state).

  hold:
    type: string (hex color RRGGBB, or "none")
    default: '"777744"'
    default_note: 'dim yellow'
    description: |
      Color shown while in Feed Hold.

  jog:
    type: string (hex color RRGGBB, or "none")
    default: '"007f3f"'
    default_note: 'teal'
